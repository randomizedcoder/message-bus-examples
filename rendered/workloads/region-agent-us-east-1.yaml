apiVersion: apps/v1
kind: Deployment
metadata:
  name: region-agent-us-east-1
  namespace: workloads
  labels:
    app.kubernetes.io/name: region-agent
    app: region-agent-us-east-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: region-agent-us-east-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: region-agent
        app: region-agent-us-east-1
    spec:
      hostname: region-agent-us-east-1
      subdomain: region-agents
      nodeSelector:
        kubernetes.io/hostname: k8s-cp1
      containers:
      - name: region-agent
        image: messagebus.local/region-agent:0.1.0
        imagePullPolicy: Never
        args:
        - -region=us-east-1
        - -grpc-addr=:9090
        - -metrics-addr=:9464
        - -codec=proto
        - -pool=all
        - -nats=nats://nats.nats.svc.cluster.local:4222
        - -amqp=amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq.rabbitmq.svc.cluster.local:5672/
        - -valkey-sentinels=valkey-0.valkey-headless.valkey.svc.cluster.local:26379,valkey-1.valkey-headless.valkey.svc.cluster.local:26379,valkey-2.valkey-headless.valkey.svc.cluster.local:26379
        - -mqtt=mqtt.mqtt.svc.cluster.local:1883
        env:
        - name: REGION
          value: us-east-1
        - name: GOGC
          value: "100"
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-credentials
              key: password
        envFrom:
        - secretRef:
            name: rabbitmq-credentials
        ports:
        - containerPort: 9090
          name: grpc
        - containerPort: 9464
          name: metrics
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9464
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9464
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: region-agent-us-east-1
  namespace: workloads
  labels:
    app.kubernetes.io/name: region-agent
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: region-agent-us-east-1
  ports:
  - name: grpc
    port: 9090
    targetPort: 9090
    nodePort: 30711

