apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats-leaf
  namespace: nats
spec:
  serviceName: nats-leaf-headless
  replicas: 1
  selector:
    matchLabels:
      app: nats-leaf
  template:
    metadata:
      labels:
        app: nats-leaf
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-w3
      containers:
      - name: nats
        image: messagebus.local/nats:2.14.6
        imagePullPolicy: Never
        command: ["/bin/nats-server", "-c", "/etc/nats/nats.conf"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitor
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/nats
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: nats-leaf-config

