apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats-leaf
  namespace: nats
spec:
  serviceName: nats-leaf-headless
  replicas: 1
  selector:
    matchLabels:
      app: nats-leaf
  template:
    metadata:
      labels:
        app: nats-leaf
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-w3
      containers:
      - name: nats
        image: messagebus.local/nats:2.14.6
        imagePullPolicy: Never
        command: ["/bin/nats-server", "-c", "/etc/nats/nats.conf"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitor
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/nats
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      # prometheus-nats-exporter sidecar — see the hub StatefulSet above.
      # One exporter per server, co-located, scraped per-pod so a worker
      # fault gaps only the leaf's target, not the hub/JetStream metrics.
      - name: nats-exporter
        image: messagebus.local/prometheus-nats-exporter:0.15.0
        imagePullPolicy: Never
        command: ["/bin/prometheus-nats-exporter"]
        args:
        - "-varz"
        - "-jsz=all"
        - "-connz"
        - "-leafz"
        - "-routez"
        - "-port"
        - "7777"
        - "http://localhost:8222"
        ports:
        - containerPort: 7777
          name: metrics
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: nats-leaf-config

