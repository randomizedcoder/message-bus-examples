apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: nats
spec:
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      affinity:
        # One nats pod per node ...
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: nats
            topologyKey: kubernetes.io/hostname
        # ... and keep the cluster (hub) on the control-plane nodes,
        # leaving the worker node free for the single leaf pod.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [ k8s-cp0, k8s-cp1, k8s-cp2 ]
      containers:
      - name: nats
        image: messagebus.local/nats:2.14.6
        imagePullPolicy: Never
        command: ["/bin/nats-server", "-c", "/etc/nats/nats.conf"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: monitor
        - containerPort: 7422
          name: leaf
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/nats
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      # prometheus-nats-exporter sidecar — scrapes THIS pod's nats-server
      # over localhost and exposes Prometheus metrics on the exporter
      # port, scraped per-pod over the headless Service. One exporter per
      # server (co-located) mirrors the redis_exporter/Valkey sidecar and
      # follows the exporter's own guidance: a single aggregating exporter
      # returns HTTP 500 for the whole scrape when any one monitored
      # server is briefly unreachable, so under rolling node faults it
      # gapped every NATS/JetStream panel. Per pod, a node fault gaps only
      # that one server's target. No readinessProbe: the exporter must
      # never gate the nats-server's own client readiness.
      - name: nats-exporter
        image: messagebus.local/prometheus-nats-exporter:0.15.0
        imagePullPolicy: Never
        command: ["/bin/prometheus-nats-exporter"]
        args:
        - "-varz"
        - "-jsz=all"
        - "-connz"
        - "-leafz"
        - "-routez"
        - "-port"
        - "7777"
        - "http://localhost:8222"
        ports:
        - containerPort: 7777
          name: metrics
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: nats-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi

