apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: nats
data:
  nats.conf: |
    # $POD_NAME is expanded from the environment at startup.
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 256MB
      max_file_store: 2GB
    }

    # Accept leaf-node connections (the leaf pod on the worker dials
    # this listener and bridges subject interest into the cluster).
    leafnodes {
      listen: 0.0.0.0:7422
    }

    cluster {
      name: nats-cluster
      listen: 0.0.0.0:6222
      routes: [
        nats://nats-0.nats-headless.nats.svc.cluster.local:6222
        nats://nats-1.nats-headless.nats.svc.cluster.local:6222
        nats://nats-2.nats-headless.nats.svc.cluster.local:6222
      ]
    }

