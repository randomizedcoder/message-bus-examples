apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: node
        static_configs:
          - targets: ['10.33.33.10:9100', '10.33.33.11:9100', '10.33.33.12:9100', '10.33.33.13:9100']
      - job_name: nats
        static_configs:
          - targets: ['nats-0.nats-headless.nats.svc.cluster.local:7777', 'nats-1.nats-headless.nats.svc.cluster.local:7777', 'nats-2.nats-headless.nats.svc.cluster.local:7777', 'nats-leaf-0.nats-leaf-headless.nats.svc.cluster.local:7777']
        # Each per-pod exporter polls its own server over localhost, so
        # prometheus-nats-exporter labels every gnatsd_* / jetstream_*
        # series with an identical server_id="http://localhost:8222".
        # Rewrite server_id to the pod name (from the unique instance
        # label, e.g. nats-0.nats-headless...:7777 -> nats-0) so the NATS
        # Server dashboard's per-server variable and panels (which key on
        # server_id) distinguish the servers again. This also matches the
        # server_name jsz already reports, keeping the two labels aligned.
        metric_relabel_configs:
          - source_labels: [instance]
            regex: '([^.]+)\..*'
            target_label: server_id
            replacement: '$1'
      - job_name: rabbitmq
        static_configs:
          - targets: ['rabbitmq-0.rabbitmq-headless.rabbitmq.svc.cluster.local:15692', 'rabbitmq-1.rabbitmq-headless.rabbitmq.svc.cluster.local:15692', 'rabbitmq-2.rabbitmq-headless.rabbitmq.svc.cluster.local:15692']
      - job_name: redis
        static_configs:
          - targets: ['valkey-0.valkey-headless.valkey.svc.cluster.local:9121', 'valkey-1.valkey-headless.valkey.svc.cluster.local:9121', 'valkey-2.valkey-headless.valkey.svc.cluster.local:9121']
      - job_name: mqtt
        static_configs:
          - targets: ['mqtt-0.mqtt-headless.mqtt.svc.cluster.local:9234', 'mqtt-1.mqtt-headless.mqtt.svc.cluster.local:9234', 'mqtt-2.mqtt-headless.mqtt.svc.cluster.local:9234']
      - job_name: cilium-agent
        static_configs:
          - targets: ['10.33.33.10:9962', '10.33.33.11:9962', '10.33.33.12:9962', '10.33.33.13:9962']
      - job_name: cilium-operator
        static_configs:
          - targets: ['10.33.33.10:9963', '10.33.33.11:9963', '10.33.33.12:9963', '10.33.33.13:9963']
      - job_name: hubble
        static_configs:
          - targets: ['10.33.33.10:9965', '10.33.33.11:9965', '10.33.33.12:9965', '10.33.33.13:9965']
      - job_name: grafana
        static_configs:
          - targets: ['grafana:3000']
      - job_name: soak-clients
        static_configs:
          - targets: ['10.33.33.1:9200', '10.33.33.1:9201', '10.33.33.1:9202', '10.33.33.1:9203', '10.33.33.1:9204', '10.33.33.1:9205', '10.33.33.1:9206', '10.33.33.1:9207', '10.33.33.1:9208', '10.33.33.1:9209', '10.33.33.1:9210', '10.33.33.1:9211']
      # proto-bench region agents (mbbench_* role=server + Go/process
      # collectors). Fast scrape so a 30s cell has enough samples.
      - job_name: workloads-agents
        scrape_interval: 5s
        static_configs:
          - targets: ['region-agent-us-west-2.region-agents.workloads.svc.cluster.local:9464', 'region-agent-us-east-1.region-agents.workloads.svc.cluster.local:9464', 'region-agent-eu-west-1.region-agents.workloads.svc.cluster.local:9464', 'region-agent-ap-south-1.region-agents.workloads.svc.cluster.local:9464']
        # Label each series with its region (from the pod DNS name,
        # e.g. region-agent-us-east-1.region-agents...:9464).
        metric_relabel_configs:
          - source_labels: [instance]
            regex: 'region-agent-([^.]+)\..*'
            target_label: agent_region
            replacement: '$1'
      # proto-bench host driver(s): benchcli OTel /metrics over the
      # k8sbr0 bridge (mbbench_* role=client).
      - job_name: proto-bench-driver
        scrape_interval: 5s
        static_configs:
          - targets: ['10.33.33.1:9300', '10.33.33.1:9301', '10.33.33.1:9302', '10.33.33.1:9303', '10.33.33.1:9304', '10.33.33.1:9305', '10.33.33.1:9306', '10.33.33.1:9307']
      # Host rpc-benchmark rpc_* /metrics (§22) over the k8sbr0 bridge — the
      # RPC-lab request/response counters, latency, bytes, and idempotent
      # replays the RPC dashboard renders. DOWN until a run passes -metrics-addr.
      - job_name: rpc-benchmark
        scrape_interval: 5s
        static_configs:
          - targets: ['10.33.33.1:9310']

