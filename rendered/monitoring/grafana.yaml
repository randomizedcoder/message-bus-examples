apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: web
    port: 3000
    targetPort: 3000
    nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [ k8s-cp0 ]
      containers:
      - name: grafana
        image: messagebus.local/grafana:13.1.4
        imagePullPolicy: Never
        # Run from Grafana's real store path, not the image's /share
        # symlink: Grafana 13's plugin loader rejects core-plugin files
        # whose symlink-resolved path escapes the logical plugin dir, so
        # a symlinked homepath crash-loops on startup. The store path has
        # the same files as real dirs. (This is what the NixOS module does.)
        command: ["/nix/store/clwz7i98k8r6ikqmxyp6hpxv72rd7phm-grafana-13.1.4/bin/grafana", "server", "--homepath=/nix/store/clwz7i98k8r6ikqmxyp6hpxv72rd7phm-grafana-13.1.4/share/grafana"]
        env:
        - name: HOME
          value: /var/lib/grafana
        - name: GF_PATHS_DATA
          value: /var/lib/grafana
        - name: GF_PATHS_LOGS
          value: /var/log/grafana
        - name: GF_PATHS_PLUGINS
          value: /var/lib/grafana/plugins
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "true"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        ports:
        - containerPort: 3000
          name: web
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        # Sibling subdirs under the provider path (which is scanned
        # recursively); nesting a mount inside the read-only soak
        # ConfigMap mount would not work.
        - name: dashboards
          mountPath: /etc/grafana/dashboards/soak
        - name: dashboards-community
          mountPath: /etc/grafana/dashboards/community
        - name: data
          mountPath: /var/lib/grafana
        - name: logs
          mountPath: /var/log/grafana
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: dashboards-community
        configMap:
          name: grafana-dashboards-community
      - name: data
        emptyDir: {}
      - name: logs
        emptyDir: {}

