apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: valkey
spec:
  serviceName: valkey-headless
  replicas: 3
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: valkey
            topologyKey: kubernetes.io/hostname
      containers:
      - name: valkey
        image: messagebus.local/valkey:9.1.1
        imagePullPolicy: Never
        command: ["/bin/sh", "/config/start-valkey.sh"]
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-credentials
              key: password
        # Node IP backing this pod's NodePort — announced so replicas
        # and Sentinel are reachable from the host (see start scripts).
        - name: POD_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 6379
          name: client
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" -p 6379 ping | grep -q PONG"]
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        # No /tmp in the minimal Nix image; the start script writes
        # (and valkey-server rewrites) its config there.
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: sentinel
        image: messagebus.local/valkey:9.1.1
        imagePullPolicy: Never
        command: ["/bin/sh", "/config/start-sentinel.sh"]
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-credentials
              key: password
        - name: POD_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 26379
          name: sentinel
        volumeMounts:
        - name: config
          mountPath: /config
        # Sentinel rewrites its config file at runtime (persisted
        # master/replica state); /tmp must exist and be writable.
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
      # redis_exporter sidecar: scrapes this pod's Valkey over localhost
      # with the shared password and exposes Prometheus metrics on
      # :9121. Prometheus scrapes each pod
      # via the headless Service (see the `redis` job in monitoring.nix)
      # so the Valkey/Redis Grafana dashboards have per-node data.
      - name: redis-exporter
        image: messagebus.local/prometheus-redis-exporter:1.90.0
        imagePullPolicy: Never
        command: ["/bin/redis_exporter"]
        args:
        - "-redis.addr=redis://localhost:6379"
        - "-web.listen-address=:9121"
        env:
        # redis_exporter reads REDIS_PASSWORD from the environment, so
        # the password stays out of the process args / ps output.
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-credentials
              key: password
        ports:
        - containerPort: 9121
          name: metrics
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: valkey-config
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi

