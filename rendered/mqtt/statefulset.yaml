apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt
  namespace: mqtt
spec:
  serviceName: mqtt-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: mqtt
            topologyKey: kubernetes.io/hostname
      containers:
      - name: mosquitto
        image: messagebus.local/mosquitto:2.1.2
        imagePullPolicy: Never
        command: ["/bin/sh", "/config/start-mosquitto.sh"]
        ports:
        - containerPort: 1883
          name: mqtt
        readinessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        # The minimal Nix image has no /tmp; the start script writes
        # its generated mosquitto.conf there, so provide a writable one.
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      # $SYS → Prometheus bridge, co-located per pod (design §11.5).
      # Subscribes to this broker's own $SYS tree over localhost —
      # $SYS is broker-local (never bridged), so per-pod scraping gives
      # per-broker stats. No readinessProbe: it must never gate the
      # broker's own client readiness (mirrors the NATS exporter).
      - name: sysexporter
        image: messagebus.local/mosquitto-sysexporter:0.1.0
        imagePullPolicy: Never
        args:
        - "-addr"
        - "localhost:1883"
        - "-metrics-addr"
        - ":9234"
        ports:
        - containerPort: 9234
          name: metrics
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: mqtt-config
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi

