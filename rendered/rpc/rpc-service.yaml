apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-service
  namespace: rpc
  labels:
    app.kubernetes.io/name: rpc-service
    app: rpc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rpc-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpc-service
        app: rpc-service
    spec:
      containers:
      - name: rpc-service
        image: messagebus.local/rpc-service:0.1.0
        imagePullPolicy: Never
        args:
        - -grpc-addr=:9440
        - -validate=true
        ports:
        - containerPort: 9440
          name: grpc
        readinessProbe:
          tcpSocket:
            port: 9440
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9440
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rpc-service
  namespace: rpc
  labels:
    app.kubernetes.io/name: rpc-service
spec:
  type: ClusterIP
  selector:
    app: rpc-service
  ports:
  - name: grpc
    port: 9440
    targetPort: 9440

