syntax = "proto3";

package workloads.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "workloads/v1/bench.proto";
import "workloads/v1/common.proto";

option go_package = "github.com/randomizedcoder/message-bus-examples/clients/gen/go/workloads/v1;workloadsv1";

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

message LogSelector {
  WorkloadRef ref = 1 [(buf.validate.field).required = true];
  optional string pod_name = 2 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
  }];
  optional string container = 3 [(buf.validate.field).string = {
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

message StreamLogsRequest {
  Envelope envelope = 1 [(buf.validate.field).required = true];
  LogSelector selector = 2 [(buf.validate.field).required = true];
  bool follow = 3;
  optional int64 tail_lines = 4 [(buf.validate.field).int64 = {
    gte: 0
    lte: 100000
  }];
  optional google.protobuf.Timestamp since = 5;
  optional google.protobuf.Duration max_duration = 6 [(buf.validate.field).duration.lte = {seconds: 3600}];
  optional uint32 max_chunks = 7 [(buf.validate.field).uint32.gte = 1];
  option (buf.validate.message).cel = {
    id: "stream_logs.tail_or_since_or_follow"
    message: "one of follow, tail_lines, or since is required"
    expression: "this.follow || has(this.tail_lines) || has(this.since)"
  };
}

message FetchLogsRequest {
  Envelope envelope = 1 [(buf.validate.field).required = true];
  LogSelector selector = 2 [(buf.validate.field).required = true];
  google.protobuf.Timestamp since = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp until = 4 [(buf.validate.field).required = true];
  int32 limit = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10000
  }];
  string page_token = 6 [(buf.validate.field).string.max_len = 1024];
  option (buf.validate.message).cel = {
    id: "fetch_logs.until_after_since"
    message: "until must be after since"
    expression: "this.until > this.since"
  };
}

message LogChunk {
  Envelope envelope = 1 [(buf.validate.field).required = true];
  string pod_name = 2 [(buf.validate.field).string.max_len = 253];
  string container = 3 [(buf.validate.field).string.max_len = 63];
  LogStream stream = 4 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp first_ts = 5;
  google.protobuf.Timestamp last_ts = 6;
  uint32 line_count = 7;
  // raw bytes on purpose: the one payload where ProtoJSON's base64 expansion
  // (x1.33) and the binary codec's zero-copy size advantage are visible.
  bytes data = 8 [(buf.validate.field).bytes.max_len = 1048576];
  bool truncated = 9;
  option (buf.validate.message).cel = {
    id: "log_chunk.ts_ordered"
    message: "last_ts must not precede first_ts"
    expression: "!has(this.first_ts) || !has(this.last_ts) || this.last_ts >= this.first_ts"
  };
}

message FetchLogsResponse {
  Envelope envelope = 1 [(buf.validate.field).required = true];
  repeated LogChunk chunks = 2 [(buf.validate.field).repeated.max_items = 1000];
  string next_page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

service LogService {
  rpc StreamLogs(StreamLogsRequest) returns (stream LogChunk);
  rpc FetchLogs(FetchLogsRequest) returns (FetchLogsResponse);
}
